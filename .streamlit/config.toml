# Native Streamlit theming -- read by the Streamlit SERVER at startup
# and sent to the frontend as part of its own early session-bootstrap
# WebSocket frames, before app.py's own Python script logic has run far
# enough to reach st.markdown(build_css(...)). This is what fixes the
# white-flash-on-load bug: without this file, the browser has no idea
# the app is dark-themed until the custom CSS injected by build_css()
# (theme.py) actually arrives, which requires the FULL script to run --
# page config, the DB-unreachable check, session-cookie read and
# validation, all of it -- before that CSS injection line is even
# reached, let alone delivered back to the browser.
#
# Measured directly, not assumed: instrumented the page to sample
# document.body's computed background color every ~20-30ms from
# navigation start. WITHOUT this file, the background stayed pure white
# (rgb(255,255,255)) for the entire ~3.5s sampling window in a local
# test -- it only turns dark once the Python script itself finishes
# running far enough to emit the CSS element. WITH this file, the
# background reliably turns dark (rgb(20,24,28) = #14181C) within
# ~100-150ms of the WebSocket opening, arriving in the same very early
# frames Streamlit uses to bootstrap the session -- well before the
# Python script has done any of its own DB/auth work, independent of
# how long that takes. (Corrected from an earlier draft of this
# comment: the color isn't available before the WebSocket opens at all
# -- the browser's very first paint, right after the JS bundle loads
# and before ANY WebSocket traffic, is still genuinely white for a
# short beat. What this file removes is the much longer, script-
# dependent wait that followed that beat before the fix.)
#
# Values below are deliberately copied from theme.py's DARK palette,
# not independently chosen -- see theme.py's build_css()/DARK dict,
# the actual source of truth for both. Dark specifically (not light):
# st.session_state.theme is never persisted (no cookie/localStorage),
# so app.py already defaults every fresh session to "dark" regardless
# of what a user picked via the in-app toggle on a previous visit --
# this file's static native theme is simply matching that same,
# already-existing default, not introducing a new one. A user who
# toggles to light mode mid-session still gets it correctly: build_css()
# applies theme-specific CSS custom properties with enough specificity
# to fully override this native base once the script actually runs,
# same as before this file existed -- this only changes what's on
# screen for the brief window BEFORE that first script run completes.
#
# base/textColor/primaryColor are set alongside backgroundColor/
# secondaryBackgroundColor, not just the two background colors alone --
# leaving base unset defaults it to "light", which would still render
# Streamlit's own native chrome (widget borders, default text color)
# in light-theme colors against this now-dark background before the
# CSS arrives: a different, still-broken flash (dark background, wrong-
# contrast text), not actually fixed. Setting the full palette here is
# what makes the very first paint already match, in full, what
# build_css() renders moments later -- confirmed to be the same hex
# values in both places, so the two never visibly disagree.
[theme]
base = "dark"
backgroundColor = "#14181C"
secondaryBackgroundColor = "#1D2329"
textColor = "#E8E6E1"
primaryColor = "#E8A23D"
